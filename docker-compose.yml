services:
  postgres:
    image: postgres:17-alpine
    container_name: hn26-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hn26}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hn26}
      POSTGRES_DB: ${POSTGRES_DB:-hn26}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hn26}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: hn26-nginx
    restart: unless-stopped
